# Оркестратор платежей (сага). Шаблон — charts/java-service
name: payment
port: 8083
image:
  repository: ghcr.io/payments-app-org/payments-payment
env:
  DB_URL: jdbc:postgresql://postgres:5432/payments
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP: kafka:9092
  ACCOUNT_URL: http://account:8081
  FRAUD_URL: http://fraud:8084
  BILLER_URL: http://biller:8087
  PROCESSING_URL: http://processing:8085
secretEnv:
  QUOTE_SECRET: QUOTE_SECRET
