# История операций (читает Kafka). Шаблон — charts/java-service
name: history
port: 8086
image:
  repository: ghcr.io/payments-app-org/payments-history
env:
  DB_URL: jdbc:postgresql://postgres:5432/payments
  KAFKA_BOOTSTRAP: kafka:9092
# Из секрета payments-secrets (Vault → External Secrets, infra/secrets.yaml)
secretEnv:
  DB_PASSWORD: DB_PASSWORD
