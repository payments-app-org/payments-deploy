# Проверка описания окружений до слияния — scripts/check.sh: шаблоны сервисов с настройками каждого окружения,
# чарты платформы с нашими настройками, YAML, shellcheck. Helm, yq и shellcheck уже есть на машинах GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check.sh
