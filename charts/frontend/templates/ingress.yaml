# http://payments.localhost/ — фронтенд. Более длинные пути (/api/users, /api/payments…) — в сервисы:
# у каждого сервиса свой Ingress, Traefik выбирает самый длинный совпавший путь
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: payments-app
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.name }}
                port:
                  name: http
