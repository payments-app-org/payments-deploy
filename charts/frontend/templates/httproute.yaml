# Вход снаружи (Gateway API): всё на хостах окружения, что не забрали другие маршруты (/api/...), — во фронтенд.
# Gateway выбирает самый длинный совпавший путь, поэтому «/» срабатывает последним
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
    app.kubernetes.io/part-of: payments-app
spec:
  parentRefs:
    - name: {{ required "route.gateway.name обязателен" .Values.route.gateway.name }}
      namespace: {{ required "route.gateway.namespace обязателен" .Values.route.gateway.namespace }}
  hostnames:
    {{- toYaml (required "route.hostnames обязателен" .Values.route.hostnames) | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.port }}
