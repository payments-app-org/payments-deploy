{{- if .Values.ingress.paths }}
# Вход снаружи: запросы http://payments.localhost/<путь> — в этот сервис (Traefik, входит в k3d)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "java-service.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.name }}
                port:
                  name: http
          {{- end }}
{{- end }}
