# Свой сервисный аккаунт у каждого сервиса — это его «паспорт» в сервисной сетке: Istio выпускает поду сертификат
# с идентичностью cluster.local/ns/<namespace>/sa/<имя>, и правила доступа (platform/mesh) пишутся по ней.
# API Kubernetes сервисам не нужен — токен в под не монтируем
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "java-service.labels" . | nindent 4 }}
automountServiceAccountToken: false
