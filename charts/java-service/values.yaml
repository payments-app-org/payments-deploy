# Значения по умолчанию для всех Java-сервисов. Сервис переопределяет нужное в services/<сервис>.yaml.

# Имя сервиса: имя Deployment, Service и адрес внутри кластера (http://<name>:<port>)
name: ""
# Порт, который слушает приложение (server.port в его application.yml)
port: 8080
replicas: 1

image:
  repository: ""
  # SHA коммита — в envs/<окружение>/services/<сервис>.yaml (записывает CI по кнопке выкатки)
  tag: ""

# Переменные окружения: адреса соседей, баз, брокера
env: {}
# Переменные из секрета: ИМЯ_ПЕРЕМЕННОЙ: ключ в секрете secretName (секрет создаёт scripts/secrets.sh)
secretEnv: {}
secretName: payments-secrets

# Память: request — сколько кластер резервирует под под, limit — больше нельзя (иначе OOMKilled).
# Куча JVM — 60% от лимита, остальное — метаспейс, потоки, кэш кода.
# Процессор: request — гарантированная доля. Ставим по тому, что JVM нужно на старте (~0,5 ядра), а не в покое
# (0,02–0,15): иначе планировщик запускает разом больше подов, чем ядер, — при перезапуске всех сервисов они
# мешают друг другу и не успевают пройти пробы. С честным запросом лишние поды ждут в очереди (Pending)
# и стартуют волнами. Предела (limit) у процессора нет: на старте JVM может взять свободные ядра
resources:
  cpu: 500m
  memory: 576Mi
jvmOptions: -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError

# Метрики для Prometheus (ServiceMonitor): включать, когда сервис отдаёт /actuator/prometheus
metrics:
  enabled: false
  path: /actuator/prometheus
  interval: 30s

# Вход снаружи (Gateway API): какие пути ведут в этот сервис (services/<сервис>.yaml).
# Через какой вход (Gateway) и на каких хостах — задаёт окружение: envs/<окружение>/env.yaml
route:
  gateway:
    name: ""
    namespace: ""
  hostnames: []
  paths: []
