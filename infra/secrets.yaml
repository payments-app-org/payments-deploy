# Секреты сервисов: External Secrets берёт ключи из Vault (secret/payments) и создаёт Secret payments-secrets.
# Сервисы читают его как раньше (secretEnv в services/<сервис>.yaml). Значения в Vault кладёт scripts/secrets.sh.
# Поменяли значение в Vault — Secret обновится за минуту; сервисы читают переменные при старте, поэтому после
# смены — kubectl -n payments rollout restart deployment
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payments-secrets
  annotations:
    # Тип ExternalSecret ставит приложение external-secrets; при самом первом развёртывании его может ещё не быть
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: payments-secrets
  # Все ключи из secret/payments: QUOTE_SECRET, CARD_HMAC_KEY, CARD_ENCRYPTION_KEY, DB_PASSWORD
  dataFrom:
    - extract:
        key: payments
