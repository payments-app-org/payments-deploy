# Postgres: одна база payments, у каждого сервиса своя схема (как в docker compose).
# Данные — на диске кластера (PersistentVolumeClaim), переживают перезапуск пода и кластера.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  # Выполняется один раз при создании пустой базы. Новый сервис со своей схемой — добавить сюда
  # (и в payments-local/infra/postgres/init.sql)
  init.sql: |
    CREATE SCHEMA IF NOT EXISTS account;
    CREATE SCHEMA IF NOT EXISTS pricing;
    CREATE SCHEMA IF NOT EXISTS payment;
    CREATE SCHEMA IF NOT EXISTS history;
    CREATE SCHEMA IF NOT EXISTS biller;
    CREATE SCHEMA IF NOT EXISTS autopayments;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: payments-app
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: payments
            - name: POSTGRES_USER
              value: payments
            - name: POSTGRES_PASSWORD
              value: payments
            # Данные — в подпапке тома: в корне тома могут быть служебные файлы, initdb требует пустую папку
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payments", "-d", "payments"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
