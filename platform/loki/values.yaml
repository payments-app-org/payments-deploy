# Хранилище логов. Логи из подов приносит Alloy (platform/alloy), смотрим в Grafana (Explore → Loki).
# Чарт grafana/loki в режиме одного процесса (SingleBinary) с диском — для одного узла хватает.
# Срок хранения, диск, память — envs/<окружение>/platform/loki.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  # Удалять старые логи (срок — limits_config.retention_period в настройках окружения)
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1

# Режим SingleBinary: остальные части Loki не нужны
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0
# Без своего nginx перед Loki, кэшей (memcached), тестовых подов и MinIO: на одном узле они только занимают память
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
