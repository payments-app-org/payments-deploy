# istio-cni — на каждом узле: при запуске пода в namespace с меткой istio.io/dataplane-mode=ambient перенаправляет
# его трафик в ztunnel (правила внутри сетевого пространства пода). Поды не перезапускаются — подключаются на ходу.
profile: ambient
# Папки CNI у k3s свои. Профиль платформы k3d (global.platform: k3d) кладёт плагин в /bin, а свежий k3s ищет
# плагины в /var/lib/rancher/k3s/data/cni — тогда ни один новый под в кластере не получает сеть
# (failed to find plugin "istio-cni"). Поэтому папки — явно, без профиля платформы
cniBinDir: /var/lib/rancher/k3s/data/cni
cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
