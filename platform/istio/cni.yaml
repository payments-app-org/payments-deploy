# istio-cni — на каждом узле: при запуске пода в namespace с меткой istio.io/dataplane-mode=ambient перенаправляет
# его трафик в ztunnel (правила внутри сетевого пространства пода). Поды не перезапускаются — подключаются на ходу.
# platform: k3d — у k3s свои пути к настройкам CNI
profile: ambient
global:
  platform: k3d
# Где k3s ищет плагины CNI: свежие k3s — /var/lib/rancher/k3s/data/cni (профиль k3d ставит в другую папку,
# и тогда ни один новый под в кластере не получает сеть: failed to find plugin "istio-cni")
cniBinDir: /var/lib/rancher/k3s/data/cni
cniConfDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 128Mi}
