# Метрики: Prometheus (собирает и хранит), Grafana (графики), сбор метрик узлов (node-exporter) и объектов
# Kubernetes (kube-state-metrics), Prometheus Operator (настраивает сбор по объектам ServiceMonitor).
# Чарт prometheus-community/kube-prometheus-stack, версия — envs/<окружение>/apps/platform/kube-prometheus-stack.yaml.
# Срок хранения, память, хосты — envs/<окружение>/platform/kube-prometheus-stack.yaml

# Тревоги: правила (PrometheusRule) проверяет Prometheus, сработавшие отправляет в Alertmanager, тот — в Telegram.
# Свои правила, настройка Alertmanager и шаблон сообщения — в manifests/ рядом
alertmanager:
  enabled: true
  alertmanagerSpec:
    # Настройку (получатели, маршруты) пишем сами: в ней токен бота, поэтому это секрет из Vault
    # (manifests/alertmanager-config.yaml). Чарт свою настройку не создаёт
    useExistingSecret: true
    configSecret: alertmanager-config
    # Шаблон текста сообщений Telegram (manifests/alertmanager-templates.yaml) → /etc/alertmanager/configmaps/
    configMaps: [alertmanager-templates]
    # Хранить заглушенные тревоги (silence) и отправленные уведомления — 2 дня
    retention: 48h
  route:
    main:
      enabled: true
      parentRefs:
        - name: external
          namespace: traefik

# Готовые правила тревог Kubernetes и Prometheus (сообщество kube-prometheus): под перезапускается по кругу
# (KubePodCrashLooping), не готов (KubePodNotReady), не хватает памяти или процессора, кончается диск, Prometheus
# не собирает цель (TargetDown)… Выключены группы компонентов, которые мы не собираем (k3s — одна программа)
defaultRules:
  create: true
  rules:
    etcd: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    windows: false
  # Отдельные правила, которые на k3d — ложная тревога: у узла (контейнер Docker) нет своей синхронизации времени,
  # часы — у Mac, node-exporter этого не видит
  disabled:
    NodeClockNotSynchronising: true
    NodeClockSkewDetected: true

# k3s собран в одну программу: метрики планировщика, контроллеров, etcd и kube-proxy отдельно не снять
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
# API-сервер отдельно не собираем: его метрики (33 тыс. рядов) нужны тем, кто чинит сам Kubernetes, не нам
kubeApiServer:
  enabled: false
kubelet:
  serviceMonitor:
    # k3s отдаёт с /metrics kubelet ещё и метрики API-сервера, etcd, планировщика — ещё 40 тыс. рядов.
    # Оставляем только метрики kubelet и контейнеров (процессор, память, сеть подов)
    metricRelabelings:
      - sourceLabels: [__name__]
        regex: (apiserver|etcd|workqueue|scheduler|apiextensions|aggregator|authentication|authorization|field_validation|flowcontrol|watch_cache|rest_client)_.*
        action: drop

prometheusOperator:
  # Проверка правил тревог при применении: правил пока нет, а задачи выпуска сертификатов для неё
  # Argo CD при каждой сверке видит как изменения
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

prometheus:
  prometheusSpec:
    # Собирать по всем ServiceMonitor/PodMonitor в кластере, а не только помеченным этим чартом:
    # ServiceMonitor сервисов создаёт наш чарт charts/java-service
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
  route:
    main:
      enabled: true
      parentRefs:
        - name: external
          namespace: traefik

grafana:
  # Пароль admin — в секрете grafana-admin: его создаёт External Secrets из Vault (secret/grafana,
  # manifests/grafana-admin.yaml). Сгенерированный чартом пароль менялся бы при каждой сверке Argo CD
  admin:
    existingSecret: grafana-admin
  sidecar:
    # Дашборды — из ConfigMap с меткой grafana_dashboard; папка — из аннотации grafana_folder.
    # Встроенные дашборды чарта (Kubernetes, Node Exporter, Prometheus) — в папку Kubernetes
    dashboards:
      folderAnnotation: grafana_folder
      annotations:
        grafana_folder: Kubernetes
      provider:
        foldersFromFilesStructure: true
  # Тестовый под Helm (helm test) не нужен: состояние проверяет Argo CD
  testFramework:
    enabled: false
  # Первый запуск Grafana — несколько минут (готовит свою базу): пока startup-проба не прошла, liveness не
  # проверяется и не перезапускает её (как у наших Java-сервисов, до 10 минут)
  startupProbe:
    httpGet:
      path: /api/health
      port: grafana
    periodSeconds: 10
    failureThreshold: 60
  # База Grafana (пользователи, настройки) — на диске: иначе после каждого перезапуска подготовка заново.
  # Размер — в настройках окружения
  persistence:
    enabled: true
  route:
    main:
      enabled: true
      parentRefs:
        - name: external
          namespace: traefik
  # Prometheus подключает сам чарт; логи и трассы — здесь. Из строки лога — переход к трассе по traceId,
  # из трассы — к логам этого запроса
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      jsonData:
        derivedFields:
          - name: traceId
            datasourceUid: jaeger
            matcherRegex: '"trace[._]?[iI]d":"(\w+)"'
            url: "$${__value.raw}"
    - name: Jaeger
      uid: jaeger
      type: jaeger
      url: http://jaeger.monitoring:16686
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          customQuery: true
          query: '{namespace="payments"} |= "$${__trace.traceId}"'
  # Готовые графики Java-сервисов с grafana.com (метрики Micrometer) — папка payments-app
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: payments-app
          folder: payments-app
          type: file
          options:
            path: /var/lib/grafana/dashboards/payments-app
  dashboards:
    payments-app:
      jvm-micrometer:
        gnetId: 4701
        revision: 10
        datasource: Prometheus
      spring-boot:
        gnetId: 19004
        revision: 1
        datasource: Prometheus
