        "overrides": []
       },
       "id": 18,
       "gridPos": {
        "x": 16,
        "y": 32,
        "w": 8,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "row",
       "title": "Kafka и устойчивость",
       "id": 19,
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 40,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "Отставание читателей Kafka",
       "description": "Сколько сообщений ещё не прочитано. Тревога — больше 100 за 10 минут",
       "targets": [
        {
         "refId": "A",
         "expr": "max by (application, topic) (kafka_consumer_fetch_manager_records_lag_max{namespace=\"payments\"})",
         "legendFormat": "{{application}} {{topic}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
