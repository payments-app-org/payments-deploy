apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-payments-security
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: payments-app
data:
  payments-security.json: |
    {
     "uid": "payments-security",
     "title": "Payments — безопасность и платформа",
     "description": "Входы в Keycloak, отказы gateway, синхронизация секретов из Vault, тревоги, память платформы",
     "tags": [
      "payments",
      "security"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "version": 1,
     "editable": true,
     "refresh": "30s",
     "time": {
      "from": "now-1h",
      "to": "now"
     },
     "panels": [
      {
       "type": "row",
       "title": "Вход (Keycloak) и gateway",
       "id": 1,
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "Входы и ошибки входа",
       "description": "login_error растёт — неверные пароли или перебор (после 5 ошибок Keycloak блокирует)",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (event) (increase(keycloak_user_events_total{event=~\"login|login_error|logout\"}[5m]))",
         "legendFormat": "{{event}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "id": 2,
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 8,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "timeseries",
       "title": "Обновления токенов",
       "description": "refresh_token_error — повтор старого refresh-токена или сессия закрыта",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (event) (increase(keycloak_user_events_total{event=~\"refresh_token|refresh_token_error|code_to_token\"}[5m]))",
         "legendFormat": "{{event}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "id": 3,
       "gridPos": {
        "x": 8,
        "y": 1,
        "w": 8,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "timeseries",
       "title": "Отказы gateway",
       "description": "401 — нет или плохой токен, 403 — чужой пользователь, 429 — лимит запросов",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (status) (rate(http_server_requests_seconds_count{application=\"gateway\",status=~\"401|403|429\"}[5m]))",
         "legendFormat": "{{status}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "reqps",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "id": 4,
       "gridPos": {
        "x": 16,
        "y": 1,
        "w": 8,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "row",
       "title": "Секреты и тревоги",
       "id": 5,
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 9,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "table",
       "title": "Секреты из Vault (External Secrets)",
       "description": "status=True — секрет синхронизирован из Vault",
       "targets": [
        {
         "refId": "A",
         "expr": "max by (namespace, name, status) (externalsecret_status_condition{condition=\"Ready\"}) == 1",
         "legendFormat": "",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "instant": true,
         "format": "table"
        }
       ],
       "options": {
        "showHeader": true,
        "sortBy": [
         {
          "displayName": "Value",
          "desc": true
         }
        ]
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true
          }
         }
        }
       ],
       "id": 6,
       "gridPos": {
        "x": 0,
        "y": 10,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "table",
       "title": "Горящие тревоги",
       "description": "То, что сейчас уходит в Telegram",
       "targets": [
        {
         "refId": "A",
         "expr": "ALERTS{alertstate=\"firing\", alertname!~\"Watchdog|InfoInhibitor\"}",
         "legendFormat": "",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "instant": true,
         "format": "table"
        }
       ],
       "options": {
        "showHeader": true,
        "sortBy": [
         {
          "displayName": "Value",
          "desc": true
         }
        ]
       },
       "fieldConfig": {
        "defaults": {
         "unit": "short"
        },
        "overrides": []
       },
       "transformations": [
        {
         "id": "organize",
         "options": {
          "excludeByName": {
           "Time": true,
           "__name__": true,
           "alertstate": true
          }
         }
        }
       ],
       "id": 7,
       "gridPos": {
        "x": 12,
        "y": 10,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "row",
       "title": "Платформа",
       "id": 8,
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 18,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "timeseries",
       "title": "Память платформы по namespace",
       "description": "Всё, кроме сервисов: мониторинг, Argo CD, Vault, Keycloak, Istio",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (namespace) (container_memory_working_set_bytes{container!=\"\", namespace!=\"payments\"})",
         "legendFormat": "{{namespace}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "id": 9,
       "gridPos": {
        "x": 0,
        "y": 19,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "timeseries",
       "title": "Память кластера: занято из выделенного Docker",
       "description": "",
       "targets": [
        {
         "refId": "A",
         "expr": "sum(container_memory_working_set_bytes{container!=\"\"})",
         "legendFormat": "поды",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        },
        {
         "refId": "B",
         "expr": "sum(machine_memory_bytes)",
         "legendFormat": "весь узел",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
        }
       },
       "fieldConfig": {
        "defaults": {
         "unit": "bytes",
         "custom": {
          "lineWidth": 1,
          "fillOpacity": 10,
          "showPoints": "never",
          "stacking": {
           "mode": "none"
          }
         }
        },
        "overrides": []
       },
       "id": 10,
       "gridPos": {
        "x": 12,
        "y": 19,
        "w": 12,
        "h": 8
       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      }
     ],
     "templating": {
      "list": []
     },
     "annotations": {
      "list": []
     }
    }
