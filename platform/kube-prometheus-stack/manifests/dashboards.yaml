      {
       "type": "timeseries",
       "title": "Потоки",
       "description": "",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (application) (jvm_threads_live_threads{namespace=\"payments\"})",
         "legendFormat": "{{application}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
         "calcs": [
          "lastNotNull",
          "max"
         ]
        },
        "tooltip": {
         "mode": "multi",
         "sort": "desc"
