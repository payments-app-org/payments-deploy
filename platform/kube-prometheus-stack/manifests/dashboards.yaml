       },
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       }
      },
      {
       "type": "timeseries",
       "title": "Сообщения в DLT",
       "description": "Не обработаны после повторов — нужен разбор",
       "targets": [
        {
         "refId": "A",
         "expr": "sum by (application, topic) (increase(kafka_producer_topic_record_send_total{namespace=\"payments\",topic=~\".+-dlt\"}[10m]))",
         "legendFormat": "{{application}} {{topic}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         }
        }
       ],
       "options": {
        "legend": {
         "displayMode": "table",
         "placement": "right",
