# Трассировка: путь одного запроса через все сервисы (gateway → payment → account → …) со временем каждого шага.
# Сервисы отправляют трассы по OTLP (http://jaeger.monitoring:4318), смотрим в Jaeger UI или в Grafana.
# Чарт jaegertracing/jaeger (Jaeger v2, все части в одном процессе). Хранение — в памяти: трассы нужны «здесь
# и сейчас», после перезапуска пода пропадают. Хост и память — envs/<окружение>/platform/jaeger.yaml
jaeger:
  httproute:
    enabled: true
    parentRefs:
      - name: external
        namespace: traefik

# Конфигурация Jaeger v2 (на основе OpenTelemetry Collector): принять OTLP → хранить в памяти → отдавать UI
userconfig:
  service:
    extensions: [jaeger_storage, jaeger_query, healthcheckv2]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [jaeger_storage_exporter]
    telemetry:
      resource:
        service.name: jaeger
      metrics:
        level: basic
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
  extensions:
    healthcheckv2:
      use_v2: true
      http:
        endpoint: 0.0.0.0:13133
    jaeger_query:
      storage:
        traces: memstore
    jaeger_storage:
      backends:
        memstore:
          memory:
            # Сколько трасс держать в памяти; старые вытесняются
            max_traces: 20000
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
  exporters:
    jaeger_storage_exporter:
      trace_storage: memstore
