# Кто кому может звонить внутри namespace payments (Istio AuthorizationPolicy, проверяет ztunnel получателя).
# Отправитель определяется не по IP, а по сертификату mTLS — идентичности его сервисного аккаунта
# (cluster.local/ns/<namespace>/sa/<аккаунт>): подделать её, не украв ключ пода, нельзя.
#
# allow-nothing — запрет по умолчанию для всего namespace; ниже для каждого получателя — список отправителей.
# Новый вызов между сервисами (новый *_URL в services/<сервис>.yaml) — добавить отправителя сюда, иначе соединение
# оборвётся (в логе отправителя — Connection reset). Prometheus (метрики) пускаем ко всем.
# Пробы Kubernetes (kubelet) правила не касаются: в ambient они идут мимо ztunnel
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-nothing
  namespace: payments
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: {}
---
# gateway ← traefik, Prometheus · вход снаружи (Traefik)
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway
  namespace: payments
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/traefik/sa/traefik
              - cluster.local/ns/monitoring/sa/kube-prometheus-stack-prometheus
---
