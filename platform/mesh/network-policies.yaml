# NetworkPolicy — второй, независимый от Istio слой: фильтр по IP на уровне сети узла (в k3s его выполняет
# встроенный kube-router). Istio решает «кто ты» (сертификат), NetworkPolicy — «откуда пакет» (namespace).
# Откажет один слой (ошибка в правилах Istio, под вне сетки) — второй всё равно не пустит.
# Входящие в payments и keycloak — только из namespace платформы; остальное (argocd, vault, default, …) — нет.
#   15008 — порт HBONE: через него ztunnel передаёт зашифрованный трафик между подами сетки
#   169.254.7.127 — адрес, с которого в ambient приходят пробы kubelet
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-platform
  namespace: payments
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [payments, traefik, monitoring, keycloak]
        - ipBlock:
            cidr: 169.254.7.127/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-platform
  namespace: keycloak
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [traefik, payments, monitoring]
        - ipBlock:
            cidr: 169.254.7.127/32
