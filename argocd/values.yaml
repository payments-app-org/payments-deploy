# Установка Argo CD (Helm-чарт argo/argo-cd): только то, что нужно одному окружению
configs:
  params:
    # TLS снимает вход (Traefik) — сам сервер отвечает по HTTP
    server.insecure: true
  cm:
    # Как часто проверять git: по умолчанию 3 минуты, нам быстрее — 1 минута
    timeout.reconciliation: 60s
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
# Не нужны: вход через внешние системы (dex), уведомления, генератор приложений (ApplicationSet)
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
