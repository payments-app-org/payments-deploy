# Общее для всех сервисов окружения prod (подключается к каждому сервису между services/ и envs/prod/services/)
route:
  # Вход в кластер: Gateway «external», его создаёт Traefik (platform/traefik/values.yaml)
  gateway:
    name: external
    namespace: traefik
  # Адрес приложения в этом окружении
  hostnames: [payments.localhost]

# Переменные всех Java-сервисов окружения (складываются с env из services/<сервис>.yaml)
env:
  # Логи в JSON (формат ECS) с traceId и spanId: Grafana находит по ним трассу запроса
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  # Трассы — в Jaeger по OTLP. Трассируем каждый запрос: нагрузка на ноутбуке маленькая (в проде обычно 1–10%)
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

# Prometheus забирает метрики сервисов с /actuator/prometheus (ServiceMonitor в charts/java-service)
metrics:
  enabled: true
