# Общее для всех сервисов окружения prod (подключается к каждому сервису между services/ и envs/prod/services/)
route:
  # Вход в кластер: Gateway «external», его создаёт Traefik (platform/traefik/values.yaml)
  gateway:
    name: external
    namespace: traefik
  # Адрес приложения в этом окружении
  hostnames: [payments.localhost]

# Переменные всех Java-сервисов окружения (складываются с env из services/<сервис>.yaml)
env:
  # Логи в JSON (формат ECS) с traceId и spanId: Grafana находит по ним трассу запроса
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  # Трассы — в Jaeger по OTLP. Трассируем каждый запрос: нагрузка на ноутбуке маленькая (в проде обычно 1–10%)
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://jaeger.monitoring:4318/v1/traces
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

# Prometheus забирает метрики сервисов с /actuator/prometheus (ServiceMonitor в charts/java-service)
metrics:
  enabled: true

# Пик памяти — на старте (Liquibase, Hibernate, загрузка классов): лимит сервиса с базой — с запасом над покоем.
# JVM в этом окружении (ноутбук, где память — главный дефицит). Замер: живых данных в куче 20–70 МБ, а JVM
# занимала кучу до 60% лимита (260–410 МБ), потому что ей разрешали. Теперь:
#   MaxRAMPercentage=35        куча — 35% лимита (110–145 МБ): в 2–3 раза больше живых данных, запас на пики
#   TieredStopAtLevel=1        только быстрый компилятор C1: меньше памяти под код и сам компилятор, старт быстрее;
#                              пиковая скорость ниже, чем с C2, — в проде с нагрузкой C2 оставляют
#   ReservedCodeCacheSize=48m  кэш скомпилированного кода: C1 хватает, по умолчанию резервируется 240 МБ
#   Xss512k                    стек обычного потока (запросы — на виртуальных потоках, им это не нужно)
jvmOptions: >-
  -XX:MaxRAMPercentage=35 -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -Xss512k
  -XX:+ExitOnOutOfMemoryError
