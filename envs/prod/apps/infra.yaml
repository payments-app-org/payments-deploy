# Postgres, Kafka, Redis — обычные манифесты из папки infra
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: payments
  source:
    repoURL: https://github.com/payments-app-org/payments-deploy.git
    targetRevision: main
    path: infra
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
