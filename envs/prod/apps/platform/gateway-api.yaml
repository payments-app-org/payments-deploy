# Типы объектов Gateway API (Gateway, HTTPRoute…) — CRD из репозитория Kubernetes SIG Network.
# Нужны Traefik и всем маршрутам, ставятся раньше остальных (sync-wave -1). Версию согласовываем с Traefik
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.1
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # CRD большие: обычное применение не помещает их в аннотацию last-applied
    syncOptions: [ServerSideApply=true]
    retry:
      limit: 10
      backoff: {duration: 10s, factor: 2, maxDuration: 3m}
