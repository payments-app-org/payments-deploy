# Метрики в окружении prod: срок хранения, диск, память, хосты
prometheus:
  prometheusSpec:
    # Хранить 2 дня, но не больше 1,5 ГБ: на ноутбуке история за месяц не нужна
    retention: 2d
    retentionSize: 1500MB
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 640Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 2Gi
  route:
    main:
      hostnames: [prometheus.localhost]

grafana:
  route:
    main:
      hostnames: [grafana.localhost]
  persistence:
    size: 1Gi
  # Grafana 13 на пиках берёт до ~500 МБ. Чарт передаёт Grafana GOMEMLIMIT = 90% лимита: если лимит меньше нужного,
  # сборщик мусора Go работает без остановки и занимает все ядра
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 640Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 96Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

alertmanager:
  route:
    main:
      hostnames: [alertmanager.localhost]
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}
